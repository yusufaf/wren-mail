version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # Major bumps (AGP, Kotlin, Compose) arrive as their own PRs so one breaking
  # upgrade cannot block the routine ones.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      gradle:
        patterns: ["*"]
        update-types: [minor, patch]
