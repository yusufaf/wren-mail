name: Release

# release-please keeps a release PR open. Merging it creates the tag and GitHub release,
# and the apk job below then builds, signs and attaches the APK. It has to live in this
# workflow: a release created with GITHUB_TOKEN does not trigger other workflows.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  apk:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Holds the signing secrets; restricted to main in the repo settings.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      # No cache: nothing a previous run left behind can end up in the signed APK.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wren-release.jks"

      - name: Build
        env:
          WREN_KEYSTORE_FILE: ${{ runner.temp }}/wren-release.jks
          WREN_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          WREN_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          WREN_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      # Without this a missing secret would quietly ship a debug-signed APK.
      - name: Verify signing certificate
        env:
          EXPECTED: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          # build-tools up to 36 print "Signer #1 certificate SHA-256 digest: <hex>", 37 prints
          # "V2 Signer: certificate SHA-256 digest: <hex>"; match the shared tail of the line.
          actual=$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | sed -n 's/^.*certificate SHA-256 digest: \([0-9a-f]\{64\}\)$/\1/p' | sort -u)
          echo "signer SHA-256: $actual"
          if [ -z "$EXPECTED" ] || [ "$actual" != "$EXPECTED" ]; then
            echo "::error::APK is not signed with the pinned release certificate (RELEASE_CERT_SHA256)."
            exit 1
          fi

      - name: Stage release files
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/wren-$TAG.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/wren-$TAG-mapping.txt"
          (cd dist && sha256sum "wren-$TAG.apk" > "wren-$TAG.apk.sha256")

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/wren-${{ needs.release-please.outputs.tag_name }}.apk

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"

      - name: Delete keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/wren-release.jks"
